<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscriptions</title>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #000; min-height: 100vh; overflow-y: scroll; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 96px 24px 80px; text-align: center; }
  .header { margin-bottom: 40px; }
  .total { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .total-sub { font-size: 14px; color: #999; margin-top: 6px; }
  .section-label { font-size: 12px; font-weight: 500; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; justify-content: center; }
  .chip { display: flex; align-items: center; gap: 7px; padding: 9px 14px; border: 1.5px solid #e5e5e5; border-radius: 14px; font-size: 13px; font-weight: 500; cursor: pointer; background: #fff; color: #000; transition: background 0.15s, border-color 0.15s; user-select: none; white-space: nowrap; }
  .chip:hover { background: #f5f5f5; }
  .chip.added { background: #000; color: #fff; border-color: #000; }
  .chip.added:hover { background: #000; }
  .add-form { display: flex; gap: 8px; margin-bottom: 32px; }
  .add-form input { flex: 1; padding: 10px 14px; border: 1px solid #e5e5e5; border-radius: 10px; font-size: 14px; outline: none; background: #fafafa; color: #000; }
  .add-form input:focus { border-color: #000; background: #fff; }
  .add-form input::placeholder { color: #bbb; }
  .price-wrap { position: relative; }
  .price-wrap span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 14px; pointer-events: none; }
  .price-wrap input { padding-left: 26px; width: 100px; -moz-appearance: textfield; appearance: textfield; }
  .price-wrap input::-webkit-outer-spin-button,
  .price-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .add-btn { padding: 10px 18px; background: #000; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .add-btn:hover { background: #333; }
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #f0f0f0; animation: slideIn 0.25s ease; }
  .item:first-child { border-top: 1px solid #f0f0f0; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .item-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 1px solid #f0f0f0; background: #fff; }
  .item-name { flex: 1; font-size: 15px; font-weight: 500; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-price { font-size: 15px; font-weight: 500; color: #000; margin-right: 4px; }
  .item-price-period { font-size: 12px; color: #aaa; margin-right: 12px; }
  .remove-btn { background: none; border: none; cursor: pointer; color: #ccc; font-size: 18px; padding: 4px; line-height: 1; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .remove-btn:hover { color: #000; background: #f5f5f5; }
  .empty { text-align: center; padding: 40px 0; color: #ccc; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Subscription budget tracker</h2>
  <div class="header">
    <div style="display:flex;align-items:baseline;justify-content:center;gap:6px">
      <div class="total" id="total">€0.00</div>
      <span style="font-size:22px;font-weight:500;color:#aaa">/m</span>
    </div>
    <div class="total-sub" id="total-sub">No subscriptions yet</div>
  </div>
  <div class="section-label">Quick add</div>
  <div class="suggestions" id="suggestions"></div>
  <div class="section-label">Add custom</div>
  <div class="add-form">
    <input type="text" id="custom-name" placeholder="Name (e.g. iCloud)" maxlength="40" />
    <div class="price-wrap">
      <span>€</span>
      <input type="number" id="custom-price" placeholder="9.99" min="0" step="0.01" />
    </div>
    <button class="add-btn" onclick="addCustom()">Add</button>
  </div>
  <div style="margin-bottom:28px"></div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty">Add a subscription above to get started</div>
</div>

let subs = JSON.parse(localStorage.getItem('subs3') || '[]');
let displayedTotal = 0;
let animFrame = null;

function save() { localStorage.setItem('subs3', JSON.stringify(subs)); }
function getTotal() { return subs.reduce((s, x) => s + x.price, 0); }

function animateTotal(target) {
  if (animFrame) cancelAnimationFrame(animFrame);
  const start = displayedTotal;
  const diff = target - start;
  const dur = 500;
  const t0 = performance.now();
  function step(now) {
    const p = Math.min((now - t0) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    displayedTotal = start + diff * ease;
    document.getElementById('total').textContent = '€' + displayedTotal.toFixed(2);
    if (p < 1) animFrame = requestAnimationFrame(step);
    else displayedTotal = target;
  }
  animFrame = requestAnimationFrame(step);
}

function renderTotal() {
  const t = getTotal();
  animateTotal(t);
  const n = subs.length;
  document.getElementById('total-sub').textContent =
    n === 0 ? 'No subscriptions yet' : n === 1 ? '1 subscription' : n + ' subscriptions';
}

function getLogo(id, size=24, customLetter=null) {
  if (SVG[id]) return SVG[id].replace(/width="\d+"/, `width="${size}"`).replace(/height="\d+"/, `height="${size}"`);
  const p = PRESETS.find(x => x.id === id);
  const color = COLORS[id] || '#888';
  const letter = customLetter || (p ? p.name[0] : (id[0]||'?')).toUpperCase();
  const r = size / 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><circle cx="${r}" cy="${r}" r="${r}" fill="${color}"/><text x="${r}" y="${r}" dominant-baseline="central" text-anchor="middle" fill="#fff" font-size="${Math.round(size*0.45)}" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,sans-serif">${letter}</text></svg>`;
}

function renderSuggestions() {
  const el = document.getElementById('suggestions');
  el.innerHTML = '';
  PRESETS.forEach(p => {
    const isAdded = subs.some(s => s.id === p.id);
    const chip = document.createElement('button');
    chip.className = 'chip' + (isAdded ? ' added' : '');
    chip.innerHTML = `<span style="display:flex;align-items:center;width:16px;height:16px;flex-shrink:0">${getLogo(p.id, 16)}</span>${p.name}`;
    chip.onclick = () => isAdded ? removeSub(p.id) : addPreset(p);
    el.appendChild(chip);
  });
}

function renderList() {
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  empty.style.display = subs.length ? 'none' : 'block';
  subs.forEach(s => {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `
      <div class="item-icon">${getLogo(s.id, 24, s.letter||null)}</div>
      <span class="item-name">${s.name}</span>
      <span class="item-price">€${s.price.toFixed(2)}</span>
      <span class="item-price-period">/mo</span>
      <button class="remove-btn" onclick="removeSub('${s.id}')" aria-label="Remove ${s.name}">×</button>
    `;
    list.appendChild(item);
  });
}

function render() { renderSuggestions(); renderList(); renderTotal(); }

function addPreset(p) {
  if (subs.some(s => s.id === p.id)) return;
  subs.unshift({ id: p.id, name: p.name, price: p.price });
  save(); render();
}

function removeSub(id) {
  subs = subs.filter(s => s.id !== id);
  save(); render();
}

function addCustom() {
  const name = document.getElementById('custom-name').value.trim();
  const price = parseFloat(document.getElementById('custom-price').value);
  if (!name || isNaN(price) || price <= 0) return;
  const id = 'custom_' + Date.now();
  subs.unshift({ id, name, price, letter: name[0].toUpperCase() });
  document.getElementById('custom-name').value = '';
  document.getElementById('custom-price').value = '';
  save(); render();
}

document.getElementById('custom-name').addEventListener('keydown', e => { if (e.key === 'Enter') addCustom(); });
document.getElementById('custom-price').addEventListener('keydown', e => { if (e.key === 'Enter') addCustom(); });

render();
</script>
</body>
</html>
