<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscriptions</title>
<script defer src="https://cdn.vercel-insights.com/v1/script.js" data-endpoint="/_vercel/insights"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #000; min-height: 100vh; overflow-y: scroll; overflow-x: hidden; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 96px 24px 80px; text-align: center; }
  .header { margin-bottom: 40px; }
  .total { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .total-sub { font-size: 14px; color: #999; margin-top: 6px; }
  .section-label { font-size: 12px; font-weight: 500; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; justify-content: center; }
  .chip { display: flex; align-items: center; gap: 7px; padding: 9px 14px; border: 1.5px solid #e5e5e5; border-radius: 14px; font-size: 13px; font-weight: 500; cursor: pointer; background: #fff; color: #000; transition: background 0.15s, border-color 0.15s; user-select: none; white-space: nowrap; }
  .chip:hover { background: #f5f5f5; }
  .chip.added { background: #000; color: #fff; border-color: #000; }
  .chip.added:hover { background: #000; }
  .add-form { display: flex; gap: 8px; margin-bottom: 32px; flex-wrap: wrap; }
  .add-form input { flex: 1; min-width: 0; padding: 10px 14px; border: 1px solid #e5e5e5; border-radius: 10px; font-size: 14px; outline: none; background: #fafafa; color: #000; }
  .add-form input:focus { border-color: #000; background: #fff; }
  .add-form input::placeholder { color: #bbb; }
  .price-wrap { position: relative; flex-shrink: 0; }
  .price-wrap span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 14px; pointer-events: none; }
  .price-wrap input { padding-left: 22px; width: 90px; -moz-appearance: textfield; appearance: textfield; }
  .price-wrap input::-webkit-outer-spin-button,
  .price-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .add-btn { padding: 10px 18px; background: #000; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .add-btn:hover { background: #333; }
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #f0f0f0; animation: slideIn 0.25s ease; }
  .item:first-child { border-top: 1px solid #f0f0f0; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .item-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 1px solid #f0f0f0; background: #fff; }
  .item-name { flex: 1; font-size: 15px; font-weight: 500; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-price { font-size: 15px; font-weight: 500; color: #000; margin-right: 4px; }
  .item-price-period { font-size: 12px; color: #aaa; margin-right: 12px; }
  .remove-btn { background: none; border: none; cursor: pointer; color: #ccc; font-size: 18px; padding: 4px; line-height: 1; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .remove-btn:hover { color: #000; background: #f5f5f5; }
  .empty { text-align: center; padding: 40px 0; color: #ccc; font-size: 14px; }
  .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .share-btn { flex: 1; padding: 12px; background: #000; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; }
  .share-btn:hover { background: #333; }
  .tweet-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 12px; background: #000; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; }
  .tweet-btn:hover { background: #333; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div style="display:flex;align-items:baseline;justify-content:center;gap:6px">
      <div class="total" id="total">$0.00</div>
      <span style="font-size:22px;font-weight:500;color:#aaa">/m</span>
    </div>
    <div class="total-sub" id="total-sub">No subscriptions yet</div>
  </div>
  <div class="section-label">Quick add</div>
  <div class="suggestions" id="suggestions"></div>
  <div class="section-label">Add custom</div>
  <div class="add-form">
    <input type="text" id="custom-name" placeholder="Name (e.g. iCloud)" maxlength="40" />
    <div class="price-wrap">
      <span>$</span>
      <input type="number" id="custom-price" placeholder="9.99" min="0" step="0.01" />
    </div>
    <button class="add-btn" onclick="addCustom()">Add</button>
  </div>
  <div style="margin-bottom:28px"></div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty">Add a subscription above to get started</div>
  <div class="btn-row" id="btn-row" style="display:none">
    <button class="share-btn" onclick="downloadReceipt()">Download receipt</button>
    <button class="tweet-btn" onclick="shareTweet()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.259 5.631 5.905-5.631Zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      Share on X
    </button>
  </div>
</div>

<script>
function shareTweet() {
  const total = getTotal();
  const totalStr = total.toFixed(2);
  const ids = subs.map(s => s.id);
  const names = subs.slice(0, 3).map(s => s.name);
  const rest = subs.length - names.length;
  let subList = names.join(', ');
  if (rest > 0) subList += ` +${rest} more`;

  let line = '';
  if (total >= 200) line = `${totalStr}/m on subscriptions. I am not okay.`;
  else if (total >= 150) line = `Spent ${totalStr}/m on subscriptions. My bank account is not thriving.`;
  else if (total >= 100) line = `${totalStr}/m on subscriptions. That's a car payment. A small one, but still.`;
  else if (total >= 75) line = `Quietly spending ${totalStr}/m on subscriptions like it's totally normal.`;
  else if (total >= 50) line = `${totalStr}/m on subscriptions. Not bad. Not great. Classic me.`;
  else if (total >= 25) line = `Only ${totalStr}/m on subscriptions. Either very disciplined or missing something.`;
  else line = `${totalStr}/m on subscriptions. Honestly impressed with myself.`;

  const has = id => ids.includes(id);
  let bonus = '';
  if (has('spotify') && has('applemusic')) bonus = 'Two music apps. Bold strategy.';
  else if (has('netflix') && has('disney') && has('max')) bonus = 'Netflix + Disney+ + Max. You respect chaos.';
  else if (has('xbox') && has('psplus')) bonus = 'Xbox AND PlayStation Plus. No console loyalty whatsoever.';
  else if (has('adobe') && has('chatgpt')) bonus = 'Adobe CC + ChatGPT. Either a creative or in full replacement anxiety mode.';
  else if (has('dropbox') && has('icloud')) bonus = 'Dropbox and iCloud. Trusting no single cloud with your stuff.';
  else if (has('youtube') && has('netflix')) bonus = 'Paying to avoid ads on two different platforms. Respect.';
  else if (has('adobe')) bonus = 'Adobe CC alone justifies a salary negotiation.';
  else if (has('chatgpt')) bonus = 'At least ChatGPT is helping you cope with the rest of the bill.';

  const text = [line, bonus, `(${subList})`, '', `What's yours? → unsub.website`].filter(Boolean).join('\n');
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
}

const PRESETS = [
  { id:'spotify',    name:'Spotify',             price:11.99 },
  { id:'netflix',    name:'Netflix',              price:17.99 },
  { id:'appletv',    name:'Apple TV+',            price:9.99  },
  { id:'disney',     name:'Disney+',              price:13.99 },
  { id:'youtube',    name:'YouTube Premium',      price:13.99 },
  { id:'prime',      name:'Amazon Prime',         price:9.99  },
  { id:'icloud',     name:'iCloud+',              price:2.99  },
  { id:'googleone',  name:'Google One',           price:1.99  },
  { id:'ms365',      name:'Microsoft 365',        price:9.99  },
  { id:'chatgpt',    name:'ChatGPT Plus',         price:20.00 },
  { id:'max',        name:'Max',                  price:15.99 },
  { id:'applemusic', name:'Apple Music',          price:10.99 },
  { id:'adobe',      name:'Adobe Creative Cloud', price:54.99 },
  { id:'psplus',     name:'PlayStation Plus',     price:8.99  },
  { id:'xbox',       name:'Xbox Game Pass',       price:14.99 },
  { id:'dropbox',    name:'Dropbox',              price:11.99 },
];

const COLORS = { spotify:'#1ed760', netflix:'#e50914', appletv:'#555', disney:'#01147c', youtube:'#ff0000', prime:'#00a8e1', icloud:'#3a86ff', googleone:'#34a853', ms365:'#d83b01', chatgpt:'#10a37f', max:'#5822b4', applemusic:'#fc3c44', adobe:'#ff0000', psplus:'#003791', xbox:'#187e3f', dropbox:'#007ee5' };

let subs = JSON.parse(localStorage.getItem('subs4') || '[]');
let displayedTotal = 0;
let animFrame = null;

function save() { localStorage.setItem('subs4', JSON.stringify(subs)); }
function getTotal() { return subs.reduce((s, x) => s + x.price, 0); }

function animateTotal(target) {
  if (animFrame) cancelAnimationFrame(animFrame);
  const start = displayedTotal, diff = target - start, dur = 500, t0 = performance.now();
  function step(now) {
    const p = Math.min((now-t0)/dur,1), ease = 1-Math.pow(1-p,3);
    displayedTotal = start + diff*ease;
    document.getElementById('total').textContent = '$'+displayedTotal.toFixed(2);
    if (p<1) animFrame = requestAnimationFrame(step); else displayedTotal = target;
  }
  animFrame = requestAnimationFrame(step);
}

function renderTotal() {
  animateTotal(getTotal());
  const n = subs.length;
  document.getElementById('total-sub').textContent = n===0?'No subscriptions yet':n===1?'1 subscription':n+' subscriptions';
  document.getElementById('btn-row').style.display = n>0?'flex':'none';
  if (n > 0) updateTweetLink();
}

function updateTweetLink() {
  const total = getTotal().toFixed(2);
  const top = subs.slice(0, 3).map(s => s.name);
  const rest = subs.length - top.length;
  let subList = top.join(', ');
  if (rest > 0) subList += ` +${rest} more`;
  const text = `I'm spending ${total}/m on subscriptions 💸\n(${subList})\n\nWhat's yours? → unsub.website`;
  document.getElementById('tweet-btn').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
}

function getLogo(id, size=24, customLetter=null) {
  if (SVGS[id]) {
    const div = document.createElement('div');
    div.innerHTML = SVGS[id];
    const svg = div.firstElementChild;
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    return svg.outerHTML;
  }
  const p = PRESETS.find(x => x.id === id);
  const color = COLORS[id] || '#888';
  const letter = customLetter || (p ? p.name[0] : (id[0]||'?')).toUpperCase();
  const r = size / 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><circle cx="${r}" cy="${r}" r="${r}" fill="${color}"/><text x="${r}" y="${r}" dominant-baseline="central" text-anchor="middle" fill="#fff" font-size="${Math.round(size*0.45)}" font-weight="600" font-family="-apple-system,sans-serif">${letter}</text></svg>`;
}

function renderSuggestions() {
  const el = document.getElementById('suggestions');
  el.innerHTML = '';
  PRESETS.forEach(p => {
    const isAdded = subs.some(s => s.id === p.id);
    const chip = document.createElement('button');
    chip.className = 'chip' + (isAdded ? ' added' : '');
    chip.innerHTML = `<span style="display:flex;align-items:center;width:16px;height:16px;flex-shrink:0">${getLogo(p.id, 16)}</span>${p.name}`;
    chip.onclick = () => isAdded ? removeSub(p.id) : addPreset(p);
    el.appendChild(chip);
  });
}

function renderList() {
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  empty.style.display = subs.length ? 'none' : 'block';
  subs.forEach(s => {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `
      <div class="item-icon">${getLogo(s.id, 24, s.letter||null)}</div>
      <span class="item-name">${s.name}</span>
      <span class="item-price">$${s.price.toFixed(2)}</span>
      <span class="item-price-period">/mo</span>
      <button class="remove-btn" onclick="removeSub('${s.id}')" aria-label="Remove">×</button>
    `;
    list.appendChild(item);
  });
}

function render() { renderSuggestions(); renderList(); renderTotal(); updateTweetLink(); }

function addPreset(p) {
  if (subs.some(s => s.id === p.id)) return;
  subs.unshift({ id: p.id, name: p.name, price: p.price });
  save(); render();
}

function removeSub(id) {
  subs = subs.filter(s => s.id !== id);
  save(); render();
}

function addCustom() {
  const name = document.getElementById('custom-name').value.trim();
  const price = parseFloat(document.getElementById('custom-price').value);
  if (!name || isNaN(price) || price <= 0) return;
  const id = 'custom_' + Date.now();
  subs.unshift({ id, name, price, letter: name[0].toUpperCase() });
  document.getElementById('custom-name').value = '';
  document.getElementById('custom-price').value = '';
  save(); render();
}

function downloadReceipt() {
  const MAX = 8, shown = subs.slice(0, MAX), extra = subs.length - MAX, total = getTotal();
  const scale = 3, W = 400, rowH = 48, topPad = 64, bottomPad = 64, dm = 24;
  const contentH = topPad + 100 + dm*2 + shown.length*rowH + (extra>0?32:0) + dm*2 + 40 + bottomPad;
  const H = Math.max(contentH, Math.round(W*5/4));
  const vOff = (H - contentH) / 2;
  const canvas = document.createElement('canvas');
  canvas.width = W*scale; canvas.height = H*scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  let y = vOff + topPad;

  ctx.fillStyle = '#aaa'; ctx.font = '500 11px -apple-system, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('MONTHLY SPEND', W/2, y); y += 20;

  const totalText = '$' + total.toFixed(2);
  ctx.font = '600 48px -apple-system, sans-serif';
  const tw = ctx.measureText(totalText).width;
  ctx.font = '500 20px -apple-system, sans-serif';
  const pw = ctx.measureText('/m').width;
  const sx = (W - (tw + 8 + pw)) / 2;
  ctx.font = '600 48px -apple-system, sans-serif'; ctx.fillStyle = '#000'; ctx.textAlign = 'left';
  ctx.fillText(totalText, sx, y+48);
  ctx.font = '500 20px -apple-system, sans-serif'; ctx.fillStyle = '#aaa';
  ctx.fillText('/m', sx+tw+8, y+48); y += 68;

  ctx.fillStyle = '#f0f0f0'; ctx.fillRect(32, y, W-64, 1); y += dm;

  shown.forEach(s => {
    const preset = PRESETS.find(p => p.id === s.id);
    const color = COLORS[s.id] || '#888';
    const letter = s.letter || (preset ? preset.name[0] : s.name[0]).toUpperCase();
    const cy = y + rowH/2;
    const rowX = 32;
    ctx.beginPath(); ctx.arc(rowX+14, cy, 14, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '600 12px -apple-system, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(letter, rowX+14, cy+4);
    ctx.fillStyle = '#000'; ctx.font = '500 14px -apple-system, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(s.name, rowX+36, cy+5);
    ctx.fillStyle = '#555'; ctx.font = '400 14px -apple-system, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('$'+s.price.toFixed(2), W-32, cy+5);
    y += rowH;
  });

  if (extra > 0) {
    ctx.fillStyle = '#aaa'; ctx.font = '400 13px -apple-system, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('+'+extra+' more', W/2, y+16); y += 32;
  }
  y += dm; ctx.fillStyle = '#f0f0f0'; ctx.fillRect(32, y, W-64, 1); y += dm;
  ctx.fillStyle = '#000'; ctx.font = '500 12px -apple-system, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('unsub.website', W/2, y+16);

  const link = document.createElement('a');
  link.download = 'unsub-receipt.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.getElementById('custom-name').addEventListener('keydown', e => { if (e.key==='Enter') addCustom(); });
document.getElementById('custom-price').addEventListener('keydown', e => { if (e.key==='Enter') addCustom(); });
render();
</script>
</body>
</html>
